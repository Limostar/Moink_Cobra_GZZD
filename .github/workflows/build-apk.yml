name: 构建 APK

# 什么时候触发：
#  1) 任何分支的 push 都会自动构建（避免因为分支保护/特性分支导致不触发）
#  2) 也可以在仓库的 Actions 页面手动点「Run workflow」
on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build-apk:
    name: 云端编译 Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: 1. 拉取仓库代码
        uses: actions/checkout@v4

      - name: 1.5 检查关键资源（模型 / 数据 / 字体 / 图标 / 配置）
        # 模型、数据或图标没进仓库时，APK 能装但一打开就崩（或桌面图标是默认绿色机器人）。
        # tools/check_repo.py 只依赖标准库，会一次性检查文件齐全度、buildozer 配置、图标尺寸、
        # 应用名一致性，并拒绝把 bin/、.buildozer/、__pycache__ 等产物带上云。
        run: |
          ls -l assets assets/models assets/data || true
          python3 tools/check_repo.py

      - name: 2. 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 3. 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev automake autopoint gettext ccache

      - name: 5. 安装 Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 6. 安装 Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.34 virtualenv

      - name: 7. 缓存 SDK / NDK / 编译中间产物
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.ccache
          # key 里带 v2：这次换了 numpy recipe（v2.3.0 → v2.3.3），
          # 必须避开上一次失败留下的半成品编译目录，否则可能复用坏缓存。
          key: buildozer-${{ runner.os }}-v2-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-v2-

      - name: 8. 编译 debug 版 APK
        env:
          PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt
        run: buildozer -v android debug

      - name: 9. 查看产物大小
        run: ls -lh bin/

      - name: 10. 上传 APK 供下载
        uses: actions/upload-artifact@v4
        with:
          name: zhinengzhenduan-bearing-diagnosis-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
